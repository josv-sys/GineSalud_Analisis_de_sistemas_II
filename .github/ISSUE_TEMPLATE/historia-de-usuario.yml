name: Historia de usuario
description: Nueva historia de usuario para el backlog del producto
title: "HU-XX — "
labels: ["historia-de-usuario"]
body:
  - type: input
    id: rol
    attributes:
      label: Como
      placeholder: recepcionista de la clínica
    validations:
      required: true
  - type: input
    id: deseo
    attributes:
      label: Deseo
      placeholder: registrar nuevas pacientes en el sistema
    validations:
      required: true
  - type: input
    id: proposito
    attributes:
      label: De manera que
      placeholder: se mantenga actualizada la base de datos
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: rf
    attributes:
      label: Requerimiento funcional relacionado
      placeholder: RF-XX
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options: ["Alta", "Media", "Baja"]
  - type: input
    id: puntos
    attributes:
      label: Estimación (Planning Poker)
      placeholder: "1, 2, 3, 5, 8, 13…"
